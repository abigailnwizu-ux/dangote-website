<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Industry Grid</title>
<style>
  body {
    font-family: Arial, sans-serif;
    color: #09064b;
    background-color: #fff;
    margin: 40px 0 60px;
    text-align: center;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .description {
    margin-bottom: 30px;
    font-size: 16px;
    font-weight: normal;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px 30px;
  }
  .item {
    width: 260px;
    margin-bottom: 30px;
  }
  .item img {
    width: 100%;
    border-radius: 6px;
    display: block;
  }
  .caption {
    font-weight: 600;
    margin-top: 8px;
  }
  .button-wrapper {
    margin-top: 40px;
  }
  .button-see-all {
    border: 1px solid #09064b;
    padding: 12px 22px;
    color: #09064b;
    background-color: #fff;
    cursor: pointer;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-radius: 0 0 0 6px;
    box-shadow: 2px 2px 6px rgba(9, 6, 75, 0.15);
    transition: background-color 0.25s, color 0.25s;
  }
  .button-see-all:hover {
    background-color: #09064b;
    color: #fff;
  }
  .button-icon {
    background-color: #09064b;
    color: #fff;
    border: none;
    padding: 12px 22px;
    font-size: 14px;
    border-radius: 0 0 6px 0;
    box-shadow: 2px 2px 6px rgba(9, 6, 75, 0.15);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  /* Icon is a small square in center */
  .button-icon::before {
    content: '';
    width: 8px;
    height: 8px;
    border: 1px solid #fff;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="container">
    <p class="description">
      As a diversified conglomerate, our interest in multiple industries indicates our determination to cater to our vision of providing basic needs.
    </p>
    <div class="grid">
      <div class="item">
        <img src="images/cement.png.bv_resized_desktop.png.bv.webp" alt="Cement Manufacturing" />
        <div class="caption">Cement Manufacturing</div>
      </div>
      <div class="item">
        <img src="images/sugar-1.png.bv_resized_desktop.png.bv (1).webp" alt="Sugar Refining" />
        <div class="caption">Sugar Refining</div>
      </div>
      <div class="item">
        <img src="images/salt1.webp" alt="Salt Refining" />
        <div class="caption">Salt Refining</div>
      </div>
      <div class="item">
        <img src="images/oil1.webp" alt="Oil Refinery" />
        <div class="caption">Oil Refinery</div>
      </div>
      <div class="item">
        <img src="images/pack1.webp" alt="Packaging" />
        <div class="caption">Packaging</div>
      </div>
      <div class="item">
        <img src="images/ferlizer1.webp" alt="Fertilizer" />
        <div class="caption">Fertilizer</div>
      </div>
    </div>

    <div class="button-wrapper">
      <button class="button-see-all">SEE ALL</button>
      <button class="button-icon" aria-label="More options"></button>
    </div>
  </div>
</body>
</html>
